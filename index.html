<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi Eyal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Star field */
    #stars-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Constellation SVGs */
    .constellation {
      position: fixed;
      opacity: 0.35;
      z-index: 1;
    }
    .constellation line {
      stroke: #aac8ff;
      stroke-width: 0.8;
    }
    .constellation circle {
      fill: #fff;
    }

    /* Center content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    h1 {
      color: #fff;
      font-size: 3.5rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-shadow: 0 0 30px rgba(180, 210, 255, 0.6);
    }

  </style>
</head>
<body>

  <canvas id="stars-canvas"></canvas>

  <!-- Orion constellation — top left -->
  <svg class="constellation" style="top:5%; left:3%; width:180px; height:240px" viewBox="0 0 180 240">
    <!-- Belt -->
    <line x1="60" y1="120" x2="90" y2="125" /><line x1="90" y1="125" x2="120" y2="120" />
    <!-- Shoulders -->
    <line x1="60" y1="120" x2="40" y2="80" /><line x1="120" y1="120" x2="140" y2="75" />
    <!-- Head -->
    <line x1="40" y1="80" x2="90" y2="55" /><line x1="140" y1="75" x2="90" y2="55" />
    <!-- Legs -->
    <line x1="60" y1="120" x2="45" y2="170" /><line x1="120" y1="120" x2="135" y2="170" />
    <!-- Stars -->
    <circle cx="40"  cy="80"  r="3.5"/>
    <circle cx="140" cy="75"  r="3.5"/>
    <circle cx="90"  cy="55"  r="2.5"/>
    <circle cx="60"  cy="120" r="2.5"/>
    <circle cx="90"  cy="125" r="2.5"/>
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="45"  cy="170" r="3"/>
    <circle cx="135" cy="170" r="3"/>
  </svg>

  <!-- Big Dipper — top right -->
  <svg class="constellation" style="top:4%; right:4%; width:220px; height:160px" viewBox="0 0 220 160">
    <!-- Cup -->
    <line x1="20"  y1="120" x2="60"  y2="100"/>
    <line x1="60"  y1="100" x2="80"  y2="120"/>
    <line x1="80"  y1="120" x2="20"  y2="120"/>
    <!-- Handle -->
    <line x1="80"  y1="120" x2="120" y2="90"/>
    <line x1="120" y1="90"  x2="160" y2="70"/>
    <line x1="160" y1="70"  x2="200" y2="40"/>
    <!-- Stars -->
    <circle cx="20"  cy="120" r="3"/>
    <circle cx="60"  cy="100" r="3"/>
    <circle cx="80"  cy="120" r="3"/>
    <circle cx="120" cy="90"  r="2.5"/>
    <circle cx="160" cy="70"  r="2.5"/>
    <circle cx="200" cy="40"  r="3"/>
  </svg>

  <!-- Cassiopeia — bottom right -->
  <svg class="constellation" style="bottom:8%; right:6%; width:200px; height:100px" viewBox="0 0 200 100">
    <line x1="10"  y1="80" x2="50"  y2="20"/>
    <line x1="50"  y1="20" x2="100" y2="60"/>
    <line x1="100" y1="60" x2="150" y2="20"/>
    <line x1="150" y1="20" x2="190" y2="70"/>
    <circle cx="10"  cy="80" r="3"/>
    <circle cx="50"  cy="20" r="3"/>
    <circle cx="100" cy="60" r="3"/>
    <circle cx="150" cy="20" r="3"/>
    <circle cx="190" cy="70" r="3"/>
  </svg>

  <!-- Southern Cross — bottom left -->
  <svg class="constellation" style="bottom:10%; left:5%; width:120px; height:140px" viewBox="0 0 120 140">
    <!-- Vertical -->
    <line x1="60" y1="10"  x2="60" y2="130"/>
    <!-- Horizontal -->
    <line x1="10" y1="70"  x2="110" y2="70"/>
    <circle cx="60"  cy="10"  r="3"/>
    <circle cx="60"  cy="130" r="3"/>
    <circle cx="10"  cy="70"  r="3"/>
    <circle cx="110" cy="70"  r="3"/>
    <circle cx="60"  cy="70"  r="2"/>
  </svg>

  <div class="content">
    <h1 id="greeting"></h1>
  </div>

  <script>
    // Dynamic greeting
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good Morning'
                   : hour < 18 ? 'Good Afternoon'
                   :             'Good Evening';
    document.getElementById('greeting').textContent = greeting;

    // Starfield
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 280 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.4 + 0.3,
      alpha: Math.random() * 0.6 + 0.4,
      speed: Math.random() * 0.008 + 0.002
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now() / 1000;
      stars.forEach(s => {
        const twinkle = s.alpha + Math.sin(now * s.speed * 10 + s.x * 100) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0.1, twinkle)})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
